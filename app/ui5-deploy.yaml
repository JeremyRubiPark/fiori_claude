specVersion: "3.0"
metadata:
  name: zsf.employee
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://<your-abap-instance>.abap-web.eu10.hana.ondemand.com
          client: "100"
        app:
          name: ZSF_EMPLOYEE
          description: SuccessFactors Employees
          package: ZSF_EMPLOYEE
          transport: <your-transport-request>
        exclude:
          - /test/
